# Prometheus Operator CRDs (optional - requires Prometheus Operator to be installed)
# These resources will be skipped if the CRDs are not available
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-fast
  namespace: atom-intents
  labels:
    app.kubernetes.io/name: go-fast-simulator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: go-fast-simulator
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: go-fast-alerts
  namespace: atom-intents
  labels:
    app.kubernetes.io/name: go-fast-simulator
spec:
  groups:
    - name: go-fast
      rules:
        # High error rate
        - alert: GoFastHighErrorRate
          expr: |
            sum(rate(http_requests_total{service="go-fast",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{service="go-fast"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High error rate in Go Fast Simulator"
            description: "Error rate is above 5% for the last 5 minutes"

        # High latency
        - alert: GoFastHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="go-fast"}[5m])) by (le))
            > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency in Go Fast Simulator"
            description: "95th percentile latency is above 2 seconds"

        # Pod not ready
        - alert: GoFastPodNotReady
          expr: |
            kube_pod_status_ready{namespace="atom-intents",pod=~"go-fast.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Go Fast pod is not ready"
            description: "Pod {{ $labels.pod }} has been not ready for 5 minutes"

        # Low replica count
        - alert: GoFastLowReplicas
          expr: |
            kube_deployment_status_replicas_available{namespace="atom-intents",deployment="go-fast"} < 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Go Fast has low replica count"
            description: "Available replicas dropped below 2"

        # Auction processing time
        - alert: GoFastSlowAuctions
          expr: |
            histogram_quantile(0.95, sum(rate(auction_processing_duration_seconds_bucket[5m])) by (le)) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Slow auction processing"
            description: "95th percentile auction processing time is above 1 second"

        # Settlement failures
        - alert: GoFastSettlementFailures
          expr: |
            sum(rate(settlements_total{status="failed"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Settlement failures detected"
            description: "One or more settlements have failed in the last 15 minutes"

        # Server wallet low balance - critical for demo operations
        - alert: ServerWalletLowBalance
          expr: |
            server_wallet_balance_uatom < 1000000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Server wallet balance critically low"
            description: "Server wallet has less than 1 ATOM. Settlements will fail. Fund the wallet immediately."

        # Server wallet warning threshold
        - alert: ServerWalletBalanceWarning
          expr: |
            server_wallet_balance_uatom < 10000000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Server wallet balance low"
            description: "Server wallet has less than 10 ATOM. Consider funding the wallet soon."

        # Chain health degraded
        - alert: ChainHealthDegraded
          expr: |
            chain_health_status == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Chain health check failing"
            description: "Chain {{ $labels.chain_id }} health check has been failing for 5 minutes"
